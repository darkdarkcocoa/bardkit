[package]
name = "live-instrument"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Server-side rules for live instrument performance: wire types, batch validation, rate limiting, performer registry"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = ["serde"]

[dev-dependencies]
serde_json = "1"
